trigger: none
pr: none

schedules:
  - cron: '0 0 * * *'
    displayName: Daily builds
    branches:
      include:
        - main
    always: true

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: ubuntu-latest
      os: linux
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-2022
        os: windows
      credscan:
        enabled: true
      policheck:
        enabled: true
      binskim:
        enabled: true
    stages:
      - stage: Build
        jobs:
          - job: Build
            displayName: Build Java SDK
            steps:
              - checkout: self
                submodules: recursive

              - task: JavaToolInstaller@1
                inputs:
                  versionSpec: '17'
                  jdkArchitectureOption: 'x64'
                  jdkSourceOption: 'PreInstalled'

              - pwsh: |
                  $settingsXml = @"
                  <settings>
                    <servers>
                      <server>
                        <id>GraphDeveloperExperiencesPublic</id>
                        <username>microsoftgraph</username>
                        <password>$(ARTIFACTS_PAT)</password>
                      </server>
                    </servers>
                    <mirrors>
                      <mirror>
                        <id>GraphDeveloperExperiencesPublic</id>
                        <mirrorOf>central</mirrorOf>
                        <url>https://microsoftgraph.pkgs.visualstudio.com/0985d294-5762-4bc2-a565-161ef349ca3e/_packaging/GraphDeveloperExperiences_Public/maven/v1</url>
                      </mirror>
                    </mirrors>
                  </settings>
                  "@
                  $settingsDir = Join-Path $HOME ".m2"
                  New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
                  $settingsXml | Set-Content (Join-Path $settingsDir "settings.xml") -Encoding UTF8
                displayName: Configure Maven settings for network-isolated build

              - task: Maven@4
                displayName: Build and Test SDK
                inputs:
                  mavenPomFile: 'pom.xml'
                  goals: 'verify'
                  options: '--no-transfer-progress'
                  publishJUnitResults: true
                  testResultsFiles: '**/surefire-reports/TEST-*.xml'
                  javaHomeOption: 'JDKVersion'
                  jdkVersionOption: '1.17'
                  jdkArchitectureOption: 'x64'
