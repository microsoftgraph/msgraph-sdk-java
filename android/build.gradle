buildscript {
    repositories {
        google()
        gradlePluginPortal()
		maven { url 'https://plugins.gradle.org/m2/' }
    }

    dependencies {
        classpath "com.gradle:gradle-enterprise-gradle-plugin:3.19.2"
        classpath "gradle.plugin.com.github.viswaramamoorthy:gradle-util-plugins:0.1.0-RELEASE"
        classpath "com.github.ben-manes:gradle-versions-plugin:0.54.0"
        classpath "com.android.tools.build:gradle:9.2.1"
    }
}

repositories {
    google()
    gradlePluginPortal()
}

apply plugin: "com.android.library"
apply plugin: "com.github.ben-manes.versions"
apply plugin: "com.github.ManifestClasspath"

android {
    namespace 'com.microsoft.graph'

    compileSdkVersion 37

    defaultConfig {
        versionCode 1
        versionName "1.0"
        minSdkVersion 26
        targetSdkVersion 36
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        textOutput "stdout"
        checkAllWarnings true
        warningsAsErrors true
        disable "UnusedResources"              // Unused will be removed on release
        disable "IconExpectedSize"             // Using the material icons provided from Google
        disable "GoogleAppIndexingApiWarning"  // We might want to index our app later
        disable "InvalidPackage"               // Butterknife, Okio and Realm
        disable "ResourceType"                 // Annotation binding
        disable "GradleDependency"
        disable "NewerVersionAvailable"
        disable "KotlinPropertyAccess" // getting false positives because of odata actions & functions (getOrder setOrder)
        disable 'AndroidGradlePluginVersion'
    }
	sourceSets {
		main {
			java.srcDirs = ['../src/main/java']
			res.srcDirs = ['../src/main/java']
			manifest.srcFile 'AndroidManifest.xml'
		}
		androidTest {
			setRoot '../src/test'
		}
	}
}


dependencies {
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    api 'com.microsoft.graph:microsoft-graph-core:4.0.0'

    implementation 'com.microsoft.kiota:microsoft-kiota-authentication-azure:2.0.0'
    api 'com.microsoft.kiota:microsoft-kiota-http-okHttp:2.0.0'
    implementation 'com.microsoft.kiota:microsoft-kiota-serialization-json:2.0.0'
    implementation 'com.microsoft.kiota:microsoft-kiota-serialization-text:2.0.0'
    implementation 'com.microsoft.kiota:microsoft-kiota-serialization-form:2.0.0'
    implementation 'com.microsoft.kiota:microsoft-kiota-serialization-multipart:2.0.0'
}
